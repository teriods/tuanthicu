name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra toàn bộ đề
        run: node tests/check-exams.js
      - name: Chuẩn bị thư mục trang web
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest .nojekyll css js icons _site/
      - name: Xuất bản lên nhánh gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
